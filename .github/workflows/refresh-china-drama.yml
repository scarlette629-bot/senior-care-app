name: Refresh China drama daily titles
on:
  schedule:
    - cron: '20 0,2,4 * * *' # 08:20, 10:20, 12:20 Asia/Taipei
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wecare-china-drama-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update entertainment and new China drama titles
        run: python3 scripts/update_entertainment.py
      - name: Validate daily China drama feed
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("public/entertainment-daily.json").read_text(encoding="utf-8"))
          feed=data.get("chinaDramaNewTitles")
          assert isinstance(feed,dict) and isinstance(feed.get("items"),list), "China drama feed not created"
          assert feed.get("checkedAt"), "Missing refresh time"
          print("China drama feed generated; titles:",len(feed["items"]))
          PY
      - name: Publish updated drama feed with concurrent-write retries
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          snapshot="$RUNNER_TEMP/wecare-drama-feed.json"
          cp public/entertainment-daily.json "$snapshot"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            python3 - "$snapshot" <<'PY'
          import json,sys
          from pathlib import Path
          current=Path("public/entertainment-daily.json")
          latest=json.loads(current.read_text(encoding="utf-8"))
          refreshed=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          for key in ("categories","recommendations","chinaDramaNewTitles","weeklyStreaming"):
              if key in refreshed:
                  latest[key]=refreshed[key]
          latest["updatedAt"]=max(str(latest.get("updatedAt","")),str(refreshed.get("updatedAt","")))
          current.write_text(json.dumps(latest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
            git add public/entertainment-daily.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: refresh China drama titles safely"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Unable to publish drama updates after five attempts"
          exit 1
