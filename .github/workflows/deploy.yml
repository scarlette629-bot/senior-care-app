name: Deploy WECARE current release and immutable v1.05 archive
# Daily China drama title discovery rollout from develop/v1.06 (v1.05 untouched).
on:
  push:
    branches: [main]
  workflow_dispatch:
  # GITHUB_TOKEN pushes from scheduled refresh do not initiate other push workflows.
  # Trigger a Pages rebuild explicitly after a successful entertainment refresh.
  workflow_run:
    workflows: ["Refresh entertainment news", "Refresh China drama daily titles", "Refresh official CPBL schedule", "Discover new series daily", "Refresh weekly Chinese topics"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  WECARE_STABLE_SHA: 1c7545150502fee79b90b562a86c6edbc2c346d7
jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.name == 'Refresh official CPBL schedule' || github.event.workflow_run.name == 'Discover new series daily' || github.event.workflow_run.name == 'Refresh weekly Chinese topics') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure main cannot deploy changes to frozen application code
        shell: bash
        run: |
          set -euo pipefail
          actual=$(git ls-remote origin refs/heads/release/v1.05-stable | cut -f1)
          test "$actual" = "$WECARE_STABLE_SHA" || { echo "::error::Frozen v1.05 branch was modified"; exit 1; }
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/deploy.yml|.github/workflows/verify-entertainment.yml|.github/workflows/refresh-china-drama.yml|scripts/prepare_v105_snapshot.py|scripts/update_entertainment.py|scripts/cpbl.py|scripts/discover_series.py|scripts/weekly_hot.py|data/series-release-evidence.json|data/series-recent-reviewed.json|tests/test_weekly_hot.py|.github/workflows/weekly-hot.yml|tests/test_series.py|tests/check_entertainment.py|public/series-discovery.json|.github/workflows/series-daily.yml|tests/test_cpbl.py|.github/workflows/cpbl-daily.yml|docs/CPBL-REPAIR.md|docs/SERIES-DISCOVERY.md|docs/VERSIONING.md|public/entertainment-daily.json) ;;
              *) echo "::error::Refusing to deploy modification of frozen v1.05 application: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$WECARE_STABLE_SHA" HEAD)
      - name: Test current-week topics
        run: python -m unittest discover -s tests -p test_weekly_hot.py -v
      - name: Test series discovery
        run: python -m unittest discover -s tests -p test_series.py -v
      - name: Test CPBL updater
        run: python -m unittest discover -s tests -p test_cpbl.py -v
      - name: Create immutable annotated Git tag v1.05
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v1.05 >/dev/null 2>&1; then
            git fetch origin tag v1.05
            test "$(git rev-parse 'v1.05^{}')" = "$WECARE_STABLE_SHA" || { echo "::error::v1.05 tag points to the wrong commit"; exit 1; }
          else
            git tag -a v1.05 "$WECARE_STABLE_SHA" -m "WECARE stable v1.05 - 2026-10-09; permanent source snapshot"
            git push origin refs/tags/v1.05
          fi
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Freeze v1.05 website once on dedicated archive branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin release/v1.05-site
          if git ls-tree -r --name-only FETCH_HEAD frozen/v1.05/index.html | grep -qx 'frozen/v1.05/index.html'; then
            echo "Immutable v1.05 archive already exists; no rebuild."
          else
            git worktree add --detach "$RUNNER_TEMP/wecare-v105-source" "$WECARE_STABLE_SHA"
            python scripts/prepare_v105_snapshot.py "$RUNNER_TEMP/wecare-v105-source" "$WECARE_STABLE_SHA"
            (
              cd "$RUNNER_TEMP/wecare-v105-source"
              npm install --no-audit --no-fund --legacy-peer-deps
              npm run build
              test -f dist/index.html
              test -f dist/version.json
            )
            git worktree add --detach "$RUNNER_TEMP/wecare-v105-site" FETCH_HEAD
            mkdir -p "$RUNNER_TEMP/wecare-v105-site/frozen/v1.05"
            cp -a "$RUNNER_TEMP/wecare-v105-source/dist/." "$RUNNER_TEMP/wecare-v105-site/frozen/v1.05/"
            (
              cd "$RUNNER_TEMP/wecare-v105-site"
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add frozen/v1.05
              git commit -m "Archive immutable built WECARE v1.05 website"
              git push origin HEAD:refs/heads/release/v1.05-site
            )
          fi
      - name: Include archived permanent /v1.05/ URL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v105-copy"
          git fetch origin release/v1.05-site
          git archive FETCH_HEAD frozen/v1.05 | tar -xf - -C "$RUNNER_TEMP/v105-copy"
          test -f "$RUNNER_TEMP/v105-copy/frozen/v1.05/index.html"
          test ! -e dist/v1.05 || { echo "::error::Current build must not overwrite archived snapshot"; exit 1; }
          mkdir -p dist/v1.05
          cp -a "$RUNNER_TEMP/v105-copy/frozen/v1.05/." dist/v1.05/
      - name: Build WECARE v1.06 separately from its development branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin develop/v1.06
          git worktree add --detach "$RUNNER_TEMP/wecare-v106-source" FETCH_HEAD
          python -c 'from pathlib import Path; p=Path("'"$RUNNER_TEMP"'/wecare-v106-source/src/App.jsx"); s=p.read_text(); a=s.index("function InterestSummary("); b=s.index("function Entertainment("); assert "const newsKinds=" not in s[a:b], "News logic leaked into home"; assert "const newsKinds=" in s[b:], "News logic missing from Entertainment"'
          node --test "$RUNNER_TEMP/wecare-v106-source/tests/cpblSchedule.test.js" "$RUNNER_TEMP/wecare-v106-source/tests/seriesFeed.test.js"
          # Keep the verified drama recommendations visibly accessible in v1.06.
          python -c 'from pathlib import Path; s=Path("'"$RUNNER_TEMP"'/wecare-v106-source/src/App.jsx").read_text(); assert "🎬 我的戲劇與綜藝推薦" in s; assert "上映／播出時間" in s; assert "故事大綱" in s; assert "📰 我的娛樂新聞" in s'
          python -c 'from pathlib import Path; s=Path("'"$RUNNER_TEMP"'/wecare-v106-source/src/App.jsx").read_text(); assert "🎬 我的戲劇與綜藝推薦" in s; assert "📚 展開往年作品" in s; assert "📰 我的娛樂新聞" in s'
          # The recommendation lists must be computed before JSX rendering.
          python -c 'from pathlib import Path; s=Path("'"$RUNNER_TEMP"'/wecare-v106-source/src/App.jsx").read_text(); p=s.index("function Entertainment("); r=s.index("return <Page back={back} title=",p); assert p < s.index("const yearStart=",p) < r; assert "thisYearRecs" in s and "undatedRecs" in s'
          test -s "$RUNNER_TEMP/wecare-v106-source/public/weekly-hot-history.json"
          python -c 'from pathlib import Path; s=Path("'"$RUNNER_TEMP"'/wecare-v106-source/src/App.jsx").read_text(); assert "currentWeeklyHot" in s; assert "showingPriorWeek" not in s and "weekly-hot-history.json" not in s'
          # Reuse the newest approved cloud data, not the older branch snapshot.
          cp public/entertainment-daily.json "$RUNNER_TEMP/wecare-v106-source/public/entertainment-daily.json"
          cp public/series-discovery.json "$RUNNER_TEMP/wecare-v106-source/public/series-discovery.json"
          (
            cd "$RUNNER_TEMP/wecare-v106-source"
            npm install --no-audit --no-fund --legacy-peer-deps
            npm run build
            test -f dist/index.html
            test -f dist/version.json
            grep -q '1.0.6' dist/version.json
            test -s dist/assets/$(sed -n 's/.*src="[^"]*\/assets\/\([^"]*\.js\)".*/\1/p' dist/index.html | head -n1)
          )
          test ! -e dist/v1.06 || { echo "::error::Current build must not overwrite v1.06 staging"; exit 1; }
          mkdir -p dist/v1.06
          cp -a "$RUNNER_TEMP/wecare-v106-source/dist/." dist/v1.06/
          cmp public/entertainment-daily.json dist/v1.06/entertainment-daily.json
          # Publish the SAME tested v1.06 code at the established URL.
          # Rebuild with the original base and PWA scope so existing home-screen
          # icons and browser localStorage retain their original origin/path.
          # Do not modify the immutable v1.05 snapshot.
          sed -i 's@base: "/senior-care-app/v1.06/"@base: "/senior-care-app/"@' "$RUNNER_TEMP/wecare-v106-source/vite.config.js"
          sed -i 's@/senior-care-app/v1.06/@/senior-care-app/@g' "$RUNNER_TEMP/wecare-v106-source/index.html" "$RUNNER_TEMP/wecare-v106-source/public/manifest.webmanifest" "$RUNNER_TEMP/wecare-v106-source/public/sw.js"
          sed -i 's@wecare-v1.0.6-shell@wecare-v1.0.6-root-shell@g' "$RUNNER_TEMP/wecare-v106-source/public/sw.js"
          # Only discard the previous ROOT service-worker shell; never touch
          # any v1.05 archive or v1.06 standalone cache/data storage.
          sed -i 's@k.startsWith("wecare-v1.0.6-")\&\&k!==CACHE@(k==="wecare-v1.0.5-shell"||k.startsWith("wecare-v1.0.6-root-"))\&\&k!==CACHE@' "$RUNNER_TEMP/wecare-v106-source/public/sw.js"
          (
            cd "$RUNNER_TEMP/wecare-v106-source"
            npm run build
            grep -q '1.0.6' dist/version.json
            grep -q '/senior-care-app/assets/' dist/index.html
            grep -q '"/senior-care-app/"' dist/manifest.webmanifest
            test -s dist/entertainment-daily.json
          )
          cp -a "$RUNNER_TEMP/wecare-v106-source/dist/." dist/
          cmp public/entertainment-daily.json dist/entertainment-daily.json
          test -f dist/v1.05/index.html
          test -f dist/v1.06/index.html
          grep -q '1.0.6' dist/version.json
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
