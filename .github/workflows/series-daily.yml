name: Discover new series daily
on:
  schedule:
    - cron: '30 22 * * *' # 06:30 Asia/Taipei, every day
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: series-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source parsing and failure handling
        run: python -m unittest discover -s tests -p test_series.py -v
      - name: Discover and verify new titles
        id: discover
        continue-on-error: true
        run: python scripts/discover_series.py
      - name: Publish titles and source health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/entertainment-daily.json public/series-discovery.json
          git diff --cached --quiet || git commit -m "data: discover and verify daily new series"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Report incomplete source checks
        if: steps.discover.outcome == 'failure'
        run: exit 1
