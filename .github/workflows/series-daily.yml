name: Discover new series daily
on:
  push:
    branches: [main]
    paths:
      - scripts/discover_series.py
      - .github/workflows/series-daily.yml
  schedule:
    - cron: '30 22,0,2 * * *' # 06:30, 08:30, 10:30 Asia/Taipei; morning backup attempts
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: series-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source parsing and failure handling
        run: python -m unittest discover -s tests -p test_series.py -v
      - name: Discover and verify new titles
        id: discover
        continue-on-error: true
        run: python scripts/discover_series.py
      - name: Publish titles and source health
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Save the new source results before refreshing the isolated CI checkout.
          snapshot="$RUNNER_TEMP/wecare-series-discovery.json"
          cp public/series-discovery.json "$snapshot"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp "$snapshot" public/series-discovery.json
            python -c 'import sys,json,datetime as dt; from pathlib import Path; sys.path.insert(0,"scripts"); from discover_series import merge,TZ; p=Path("public/entertainment-daily.json"); now=dt.datetime.now(TZ); feed=merge(json.loads(p.read_text()),json.loads(Path("public/series-discovery.json").read_text()),now); p.write_text(json.dumps(feed,ensure_ascii=False,indent=2)+"\n")'
            git add public/entertainment-daily.json public/series-discovery.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "data: discover and verify daily new series"
            if git push origin HEAD:main; then exit 0; fi
          done
          echo "::error::Could not publish source results after three concurrent-update retries"
          exit 1
      - name: Report incomplete source checks
        if: steps.discover.outcome == 'failure'
        run: exit 1
