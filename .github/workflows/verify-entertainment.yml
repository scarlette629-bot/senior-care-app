name: Verify entertainment regression fixes
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile updater
        run: python -m py_compile scripts/update_entertainment.py
      - name: Verify screened source data and prebuilt preview
        run: python tests/check_entertainment.py
      - name: Test offline daily-refresh fallback
        env:
          WECARE_OFFLINE: '1'
        run: |
          python scripts/update_entertainment.py
          python tests/check_entertainment.py
      - name: Compile React app
        run: |
          npm install --no-audit --no-fund
          npm run build
